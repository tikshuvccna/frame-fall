<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7b6cf6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap">
  <link rel="icon" href="data:,">
  <title>המרוץ לכתר</title>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="pad"><div id="stick"><div id="knob"></div></div></div>
  <div id="hud" class="hide">
    <div id="question" dir="auto"></div>
    <div id="chips"><span id="rank"></span><span id="qual"></span><span id="coinChip"></span></div>
    <div id="bar"><i></i></div>
    <div id="host"></div>
  </div>
  <button id="volBtn" type="button" aria-label="עוצמת קול">🔊</button>
  <button id="pauseBtn" type="button" aria-label="השהיה" title="השהיה (Esc)">⏸</button>
  <div id="volBox" class="hide">
    <label><span>מוזיקה</span><input id="volMusic" type="range" min="0" max="1" step="0.1"></label>
    <label><span>צלילים</span><input id="volSound" type="range" min="0" max="1" step="0.1"></label>
  </div>
  <div id="pause" class="card hide">
    <h1>המשחק מושהה</h1>
    <div class="row">
      <button id="pauseResume" type="button" class="big">המשך</button>
      <button id="pauseRestart" type="button" class="big alt">התחל מחדש</button>
      <button id="pauseMenu" type="button" class="big alt">חזרה למופע</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="count"></div>
  <button id="btnJump" type="button" class="act">קפיצה</button>
  <button id="btnDive" type="button" class="act">זינוק</button>
  <div id="card" class="card">
    <div class="top"><span id="purse"></span><h1>המרוץ לכתר</h1><span id="who"></span></div>
    <button id="season" type="button"><span id="seasonTxt"></span><i id="seasonBar"><b></b></i></button>
    <p id="load">טוען...</p>
    <div id="intro" class="hide">
      <div id="levels"></div>
      <p id="tip"></p>
      <p class="keys">מקלדת: חיצים לריצה, רווח לקפיצה, Shift לזינוק</p>
      <div id="nav">
        <button type="button" data-s="locker"><i>👕</i>ארונית</button>
        <button type="button" data-s="prizes"><i>🏆</i>פרסים</button>
        <button type="button" data-s="album"><i>🃏</i>אלבום</button>
        <button type="button" data-s="records"><i>⏱️</i>שיאים</button>
        <button type="button" data-s="settings"><i>⚙️</i>הגדרות</button>
        <button type="button" data-s="credits"><i>✨</i>קרדיטים</button>
      </div>
      <div class="row"><button id="go" type="button" class="big">יוצאים לדרך</button><button id="daily" type="button" class="big alt"></button></div>
    </div>
  </div>
  <div id="end" class="card hide">
    <h1 id="endTitle"></h1>
    <p id="stars"></p>
    <p id="endLine"></p>
    <p id="endGain"></p>
    <p id="endPurse"></p>
    <div class="row">
      <button id="next" type="button" class="big">לשלב הבא</button>
      <button id="again" type="button" class="big alt">עוד סיבוב</button>
      <button id="menu" type="button" class="big alt">כל השלבים</button>
    </div>
  </div>
  <div id="mini" class="card hide">
    <h1 id="miniTitle"></h1>
    <p class="keys2">רוצו אל הדלת עם התשובה הנכונה. מדליה מקבלים עם 3 טעויות לכל היותר.</p>
    <div id="miniLevels"></div>
    <div class="row">
      <button id="miniLearn" type="button" class="big alt">ללמוד שוב</button>
      <button id="miniBack" type="button" class="big alt">חזרה למופע</button>
    </div>
  </div>
  <div id="lesson" class="hide"></div>
  <div id="panel" class="hide"></div>
  <div id="prize" class="card hide">
    <h1>פרס חדש!</h1>
    <p id="prizeList"></p>
    <div class="row">
      <button id="prizeGo" type="button" class="big">לארונית</button>
      <button id="prizeOk" type="button" class="big alt">המשך</button>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
